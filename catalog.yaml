# PayNGo product catalog — the products the camera should recognize.
#
# This is the single source of truth for the *next* dataset. Order matters:
# the index of each product below becomes its YOLO class id in
# cv-ml-core/data/dataset-v2.yaml, which synthesize_products.py writes.
#
#   source: existing  -> the class is already in yolo-dataset (real photos of
#                        your own shelf); its labels are copied into the new
#                        dataset as-is. The first four entries MUST stay in
#                        ids 0..3 because those are the ids the old labels use
#                        (synthesize_products.py asserts this).
#   query / queries   -> packshots are downloaded from the web for this class.
#                        The query is what gets typed into an image search, so
#                        make it specific (pack format, flavour, size).
#   urls              -> optional: paste direct image URLs here to skip the
#                        search entirely (useful when a query keeps returning
#                        lifestyle photos instead of packshots).
#
# Rebuild the dataset after any edit:
#   python synthesize_products.py search --per-product 12
#   python synthesize_products.py build
#   python prepare_dataset.py --source cv-ml-core/data/yolo-v2-dataset \
#       --data cv-ml-core/data/dataset-v2.yaml
#
# Prices are whole rupees and are what web/lib/products.ts will need when you
# cut the app over to this catalog.

products:
  # --- already photographed on your shelf; do not reorder these four ---
  - slug: blue-lays
    label: Lays Blue
    price: 1
    source: existing

  - slug: green-lays
    label: Lays Green
    price: 1
    source: existing

  - slug: orange-lays
    label: Lays Orange
    price: 1
    source: existing

